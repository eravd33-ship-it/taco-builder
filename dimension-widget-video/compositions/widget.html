    /* מימין לשמאל: בלוק ראשון בצד ימין, החצים מצביעים שמאלה */

    #w-b1 { grid-area: 1 / 1; --size: 202px; --glow: #6fbf3a; } /* הבלוק הראשון (המימד הנוכחי) גדול יותר */
    #w-a1 { grid-area: 1 / 2; }
    #w-b2 { grid-area: 1 / 3; --glow: #d63a3a; }

    #w-l1 { grid-area: 2 / 1; color: var(--gold); font-weight: 800; }

    /* פס התקדמות */

    #w-fill {

      transform-origin: 100% 50%;

    /* מעבר ברק אחד על הקופסה */
    #w-shine {
      position: absolute;
      top: -20%;

      pointer-events: none;
    }
  </style>

  <div
    id="root"
    data-composition-id="widget"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[
      {"id":"word","type":"string","label":"Title: word","default":"מימד"},
      {"id":"current","type":"string","label":"Title: current dimension","default":"1"},
      {"id":"of","type":"string","label":"Title: of total","default":"מתוך 3"},
      {"id":"progress","type":"number","label":"Progress (0-1)","default":0.3333,"min":0,"max":1,"step":0.01},
      {"id":"label1","type":"string","label":"Label 1","default":"העולם הרגיל"},
      {"id":"label2","type":"string","label":"Label 2","default":"הנת׳ר"},
      {"id":"label3","type":"string","label":"Label 3","default":"האנד"},
      {"id":"block1","type":"string","label":"Block 1 image","default":"assets/blocks/grass.png"},
      {"id":"block2","type":"string","label":"Block 2 image","default":"assets/blocks/netherrack.png"},
      {"id":"block3","type":"string","label":"Block 3 image","default":"assets/blocks/end-stone.png"}
    ]'
  >
    <div id="w-panel">
      <h1 id="w-title">
        <span data-var-text="word">מימד</span>
        <b data-var-text="current">1</b>
        <span data-var-text="of">מתוך 3</span>
      </h1>

      <div id="w-row">
        <div id="w-b1" class="w-block"><img src="assets/blocks/grass.png" data-var-src="block1" alt="" /></div>
        <svg id="w-a1" class="w-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6" /></svg>
        <div id="w-b2" class="w-block"><img src="assets/blocks/netherrack.png" data-var-src="block2" alt="" /></div>
        <svg id="w-a2" class="w-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6" /></svg>
        <div id="w-b3" class="w-block"><img src="assets/blocks/end-stone.png" data-var-src="block3" alt="" /></div>

        <div id="w-l1" class="w-label" data-var-text="label1">העולם הרגיל</div>
        <div id="w-l2" class="w-label" data-var-text="label2">הנת׳ר</div>
        <div id="w-l3" class="w-label" data-var-text="label3">האנד</div>
      </div>

      <div id="w-progress"><div id="w-fill"></div></div>
      <div id="w-shine" data-layout-allow-overflow></div>
    </div>
  </div>

  <script>
    const { progress } = window.__hyperframes.getVariables();

    // cubic-bezier(x1, y1, x2, y2) כמו ב-CSS, כדי לקבל בדיוק את אותו Overshoot
    function bezier(x1, y1, x2, y2) {
      const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
      const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
      const sampleX = (t) => ((ax * t + bx) * t + cx) * t;
      const sampleY = (t) => ((ay * t + by) * t + cy) * t;
      const slopeX = (t) => (3 * ax * t + 2 * bx) * t + cx;
      return (x) => {
        if (x <= 0) return 0;
        if (x >= 1) return 1;
        let t = x;
        for (let i = 0; i < 8; i++) {
          const err = sampleX(t) - x;
          if (Math.abs(err) < 1e-6) return sampleY(t);
          const d = slopeX(t);
          if (Math.abs(d) < 1e-6) break;
          t -= err / d;
        }
        let lo = 0, hi = 1;
        t = x;
        for (let i = 0; i < 40; i++) {
          const err = sampleX(t) - x;
          if (Math.abs(err) < 1e-6) break;
          if (err > 0) hi = t; else lo = t;
          t = (lo + hi) / 2;
        }
        return sampleY(t);
      };
    }

    const POP = bezier(0.175, 0.885, 0.32, 1.275); // הכניסה: קפיצה עם Overshoot
    const POP_OUT = bezier(0.6, -0.28, 0.735, 0.045); // היציאה: הכניסה במראה
    const IN = 0.5; // משך כל פופ-אפ
    const STEP = 0.2; // הפרש בין אלמנטים
    const HOLD_UNTIL = 5.0; // מתי מתחילה היציאה
    const OUT = 0.28;
    const OUT_STEP = 0.08;

    const tl = gsap.timeline({ paused: true });

    // כניסה: כותרת (0) → בלוק 1 (0.2) → חץ (0.4) → בלוק 2 (0.6) → חץ (0.8) → בלוק 3 (1.0)
    const sequence = [
      ["#w-title"],
      ["#w-b1", "#w-l1"],
      ["#w-a1"],
      ["#w-b2", "#w-l2"],
      ["#w-a2"],
      ["#w-b3", "#w-l3"],
    ];

    tl.fromTo("#w-panel", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0);
    sequence.forEach((targets, i) => {
      tl.fromTo(targets, { scale: 0 }, { scale: 1, duration: IN, ease: POP }, i * STEP);
    });

    // התקדמות: הפס קופץ פנימה ואז מתמלא עד 1/3
    tl.fromTo("#w-progress", { scale: 0 }, { scale: 1, duration: IN, ease: POP }, 1.4);
    tl.fromTo("#w-fill", { scaleX: 0 }, { scaleX: progress, duration: 0.8, ease: "power3.out" }, 1.75);

    // ברק אחד על הקופסה
    tl.fromTo("#w-shine", { xPercent: -150 }, { xPercent: 450, duration: 1, ease: "power2.inOut" }, 2.0);

    // יציאה בסדר הפוך, קצרה מהכניסה
    const exit = [["#w-progress"], ...sequence.slice().reverse()];
    exit.forEach((targets, i) => {
      tl.fromTo(
        targets,
        { scale: 1 },
        { scale: 0, duration: OUT, ease: POP_OUT, immediateRender: false },
        HOLD_UNTIL + i * OUT_STEP,
      );
    });
    tl.fromTo(
      "#w-panel",
      { opacity: 1 },
      { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false },
      HOLD_UNTIL + exit.length * OUT_STEP,
    );

    window.__timelines = window.__timelines || {};
    window.__timelines["widget"] = tl;
  </script>
</template>
