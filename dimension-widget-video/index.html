<!doctype html>
<html
  lang="he"
  dir="rtl"
  data-composition-variables='[
    {"id":"showBackground","type":"boolean","label":"Show background (off = transparent overlay)","default":true}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent; /* שקוף: ה-mp4 מקבל רקע מ-#stage-bg, ה-webm/mov נשארים שקופים */
      }
      #stage-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(ellipse at 50% 38%, rgba(96, 120, 200, 0.55) 0%, rgba(96, 120, 200, 0) 62%),
          linear-gradient(135deg, #1e3a5f 0%, #2d2a5e 52%, #14301f 100%);
      }
      #widget {
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage-bg" class="clip" data-start="0" data-duration="6" data-layout-ignore></div>

      <div
        id="widget"
        data-composition-id="widget"
        data-composition-src="compositions/widget.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      const { showBackground } = window.__hyperframes.getVariables();
      if (showBackground === false) document.getElementById("stage-bg").style.display = "none";

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
