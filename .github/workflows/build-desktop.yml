name: Build desktop app

# Builds a ready-to-run Creator Desk for Windows and macOS, so nobody needs Python.
# Every run keeps the result under Actions -> this workflow -> a run -> Artifacts.
# To publish a version (the site's download buttons pick it up by themselves), either
# run this workflow by hand with "publish" ticked, or push a tag such as v0.1.0.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the build as a GitHub Release (tag v<app version>)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "creator-bot/**"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: creator-bot
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-window.txt pyinstaller

      - name: Tests
        run: python -m pytest -q

      - name: Build the app
        run: python build_desktop.py

      - name: Check that the built app starts (Windows)
        if: runner.os == 'Windows'
        env:
          # lets the smoke test check the AI assistant inside the built app against a fake API
          ANTHROPIC_BASE_URL: http://127.0.0.1:8798
          ANTHROPIC_API_KEY: sk-ant-smoke-test-key-000000
        run: |
          "dist/Creator Desk/Creator Desk.exe" --no-window --port 8799 &
          python packaging/smoke_test.py 8799 8798

      - name: Check that the built app starts (macOS)
        if: runner.os == 'macOS'
        env:
          # lets the smoke test check the AI assistant inside the built app against a fake API
          ANTHROPIC_BASE_URL: http://127.0.0.1:8798
          ANTHROPIC_API_KEY: sk-ant-smoke-test-key-000000
        run: |
          "dist/Creator Desk.app/Contents/MacOS/Creator Desk" --no-window --port 8799 &
          python packaging/smoke_test.py 8799 8798

      - name: Show the app log if something failed
        if: failure()
        run: |
          cat "$APPDATA/CreatorDesk/creator-desk.log" 2>/dev/null || true
          cat "$HOME/Library/Application Support/CreatorDesk/creator-desk.log" 2>/dev/null || true

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Creator Desk.app" "Creator-Desk-macOS.zip"

      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Creator-Desk-Windows
          path: creator-bot/dist/Creator Desk
          if-no-files-found: error

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Creator-Desk-macOS
          path: creator-bot/Creator-Desk-macOS.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the files
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Creator-Desk-Windows
          path: "Creator Desk"

      - uses: actions/download-artifact@v4
        with:
          name: Creator-Desk-macOS
          path: mac

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            TAG="$REF_NAME"
          else
            VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' creator-bot/creator_bot/desktop/__init__.py)
            TAG="v$VERSION"
          fi
          zip -qr Creator-Desk-Windows.zip "Creator Desk"
          mv mac/Creator-Desk-macOS.zip .
          cat > notes.md <<'NOTES'
          אפליקציה חינמית למחשב, בלי הרשמה ובלי Python.

          - Windows: מחלצים את `Creator-Desk-Windows.zip` ופותחים את `Creator Desk.exe`.
          - Mac: מחלצים את `Creator-Desk-macOS.zip`, לוחצים קליק ימני על `Creator Desk` ואז Open.

          האפליקציה עוד לא חתומה דיגיטלית, ולכן Windows ו-Mac מציגים אזהרה בפעם הראשונה.
          הוראות מלאות: https://eravd33-ship-it.github.io/taco-builder/download.html
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" Creator-Desk-Windows.zip Creator-Desk-macOS.zip --clobber
          else
            gh release create "$TAG" Creator-Desk-Windows.zip Creator-Desk-macOS.zip \
              --target "$GITHUB_SHA" --title "Creator Desk $TAG" --notes-file notes.md --latest
          fi
